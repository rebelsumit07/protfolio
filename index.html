<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=https://sumitkumar-yadav.com.np">
    <link rel="canonical" href="https://sumitkumar-yadav.com.np">
    <title>Redirecting...</title>
    <style>
        body {
            background-color: #ffffff;
            color: #111827;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            gap: 16px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.75s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .text {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #374151;
        }

        .count {
            font-weight: 700;
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p class="text">Redirecting in <span class="count" id="countdown">2</span>...</p>

    <script>
        let seconds = 1;
        const countEl = document.getElementById("countdown");
        const targetUrl = "https://sumitkumar-yadav.com.np";

        const timer = setInterval(() => {
            seconds--;
            if (seconds > 0) {
                countEl.textContent = seconds;
            } else {
                clearInterval(timer);
                countEl.textContent = "0";
                window.location.replace(targetUrl);
            }
        }, 1000);
    </script>
</body>
</html>
